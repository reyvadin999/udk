{% extends "base.html" %}

{% block title %}Login | UDK Mezun{% endblock %}

{% block content %}
<div class="flex items-center justify-center h-full min-h-[70vh]">
    <div class="glass w-full max-w-md rounded-2xl p-8 shadow-2xl relative overflow-hidden">
        
        <!-- Decorative subtle element -->
        <div class="absolute -top-24 -right-24 w-48 h-48 bg-primary-600 rounded-full mix-blend-multiply filter blur-3xl opacity-20"></div>
        <div class="absolute -bottom-24 -left-24 w-48 h-48 bg-teal-600 rounded-full mix-blend-multiply filter blur-3xl opacity-20"></div>

        <div class="relative z-10">
            <div class="text-center mb-10">
                <h1 class="text-3xl font-bold text-white mb-2">🏔️ UDK Mezun</h1>
                <p class="text-gray-400">Equipment & Safety Tracker</p>
            </div>

            <form method="POST" action="{{ url_for('login') }}" class="space-y-6">
                <div>
                    <label for="username" class="block text-sm font-medium text-gray-300">Username</label>
                    <div class="mt-1">
                        <input id="username" name="username" type="text" required 
                            class="appearance-none block w-full px-4 py-3 bg-dark-900/50 border border-white/10 rounded-xl shadow-inner placeholder-gray-500 text-white focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent transition">
                    </div>
                </div>

                <div>
                    <label for="password" class="block text-sm font-medium text-gray-300">Password</label>
                    <div class="mt-1">
                        <input id="password" name="password" type="password" required 
                            class="appearance-none block w-full px-4 py-3 bg-dark-900/50 border border-white/10 rounded-xl shadow-inner placeholder-gray-500 text-white focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent transition">
                    </div>
                </div>

                <div>
                    <button type="submit" 
                        class="w-full flex justify-center py-3 px-4 border border-transparent rounded-xl shadow-lg text-sm font-medium text-white bg-gradient-to-r from-primary-600 to-primary-500 hover:from-primary-500 hover:to-primary-400 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-500 transform hover:-translate-y-0.5 transition duration-150">
                        Sign in
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
