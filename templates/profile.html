{% extends "base.html" %}

{% block title %}My Profile | UDK Mezun{% endblock %}

{% block content %}
<div class="mb-8 border-b border-white/10 pb-6">
    <h1 class="text-3xl font-bold text-white">Profile Settings</h1>
    <p class="text-gray-400 mt-1">Update your contact information and password.</p>
</div>

<div class="max-w-2xl mx-auto">
    <div class="glass rounded-2xl p-8 border border-white/10 shadow-2xl">
        <form method="POST" class="space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="space-y-2 col-span-2">
                    <label class="block text-sm font-medium text-gray-400">Username</label>
                    <input type="text" value="{{ current_user.username }}" disabled 
                        class="block w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-gray-500 cursor-not-allowed">
                </div>
                
                <div class="space-y-2">
                    <label class="block text-sm font-medium text-gray-300">Email Address</label>
                    <input type="email" name="email" value="{{ current_user.email or '' }}" 
                        class="block w-full px-4 py-3 bg-dark-900 border border-white/10 rounded-xl text-white focus:outline-none focus:ring-2 focus:ring-primary-500 transition">
                </div>

                <div class="space-y-2">
                    <label class="block text-sm font-medium text-gray-300">Phone Number</label>
                    <input type="text" name="phone" value="{{ current_user.phone_number or '' }}" 
                        class="block w-full px-4 py-3 bg-dark-900 border border-white/10 rounded-xl text-white focus:outline-none focus:ring-2 focus:ring-primary-500 transition">
                </div>
            </div>

            <div class="pt-4 border-t border-white/10">
                <div class="space-y-2">
                    <label class="block text-sm font-medium text-gray-300">New Password</label>
                    <input type="password" name="password" placeholder="Leave blank to keep current"
                        class="block w-full px-4 py-3 bg-dark-900 border border-white/10 rounded-xl text-white focus:outline-none focus:ring-2 focus:ring-primary-500 transition placeholder-gray-600">
                    <p class="text-xs text-gray-500">Only fill this out if you wish to change your login password.</p>
                </div>
            </div>

            <div class="pt-6">
                <button type="submit" class="w-full py-4 bg-primary-600 hover:bg-primary-500 text-white rounded-xl shadow-lg transition transform hover:-translate-y-0.5 font-bold">
                    Save Changes
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
