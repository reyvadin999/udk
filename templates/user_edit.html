{% extends "base.html" %}

{% block title %}Edit User | UDK Mezun{% endblock %}

{% block content %}
<div class="mb-8 flex items-center space-x-4">
    <a href="{{ url_for('user_list') }}" class="text-gray-400 hover:text-white bg-white/5 hover:bg-white/10 p-2 rounded-lg transition transform hover:-translate-x-1">&larr; Back</a>
    <div>
        <h1 class="text-3xl font-bold text-white">Edit User: {{ user.username }}</h1>
        <p class="text-gray-400 mt-1">Modify account details and permissions.</p>
    </div>
</div>

<div class="glass rounded-2xl p-8 max-w-2xl mx-auto shadow-xl border-t border-primary-500/50">
    <form method="POST" class="space-y-6">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="space-y-2">
                <label class="block text-sm font-medium text-gray-300">Username</label>
                <input type="text" name="username" value="{{ user.username }}" required 
                    class="block w-full px-4 py-3 bg-dark-900 border border-white/10 rounded-xl shadow-inner text-white focus:outline-none focus:ring-2 focus:ring-primary-500 transition">
            </div>
            
            <div class="space-y-2">
                <label class="block text-sm font-medium text-gray-300">Reset Password</label>
                <input type="password" name="password" placeholder="Leave blank to keep current"
                    class="block w-full px-4 py-3 bg-dark-900 border border-white/10 rounded-xl shadow-inner text-white focus:outline-none focus:ring-2 focus:ring-primary-500 transition placeholder-gray-600">
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="space-y-2">
                <label class="block text-sm font-medium text-gray-300">Email Address</label>
                <input type="email" name="email" value="{{ user.email or '' }}" 
                    class="block w-full px-4 py-3 bg-dark-900 border border-white/10 rounded-xl shadow-inner text-white focus:outline-none focus:ring-2 focus:ring-primary-500 transition">
            </div>

            <div class="space-y-2">
                <label class="block text-sm font-medium text-gray-300">Phone Number</label>
                <input type="text" name="phone" value="{{ user.phone_number or '' }}" 
                    class="block w-full px-4 py-3 bg-dark-900 border border-white/10 rounded-xl shadow-inner text-white focus:outline-none focus:ring-2 focus:ring-primary-500 transition">
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 items-end">
            <div class="space-y-2">
                <label class="block text-sm font-medium text-gray-300">System Role</label>
                <select name="role" required 
                    class="block w-full px-4 py-3 bg-dark-900 border border-white/10 rounded-xl shadow-inner text-white focus:outline-none focus:ring-2 focus:ring-primary-500 transition">
                    {% for r in roles %}
                    <option value="{{ r }}" {% if user.role == r %}selected{% endif %}>{{ r }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="flex items-center space-x-3 h-full mb-3">
                <input type="checkbox" name="is_active" id="is_active" {% if user.is_active %}checked{% endif %}
                    class="w-5 h-5 rounded border-white/10 bg-dark-900 text-primary-500 focus:ring-primary-500">
                <label for="is_active" class="text-sm font-medium text-gray-300">Account Active</label>
            </div>
        </div>

        <div class="pt-6 border-t border-white/10">
            <button type="submit" class="w-full py-4 bg-gradient-to-r from-primary-600 to-primary-500 hover:from-primary-500 text-white rounded-xl shadow-lg transition transform hover:-translate-y-0.5 font-bold text-lg">
                Update User
            </button>
        </div>
    </form>
</div>
{% endblock %}
