{% extends "base.html" %}

{% block title %}Add Equipment | UDK Mezun{% endblock %}

{% block content %}
<div class="mb-8 border-b border-white/10 pb-6 flex items-center space-x-4">
    <a href="{{ url_for('gear_list') }}" class="text-gray-400 hover:text-white bg-white/5 hover:bg-white/10 p-2 rounded-lg transition transform hover:-translate-x-1">&larr; Back</a>
    <div>
        <h1 class="text-3xl font-bold text-white">Add New Equipment</h1>
        <p class="text-gray-400 mt-1">Register a new physical asset into the club's inventory.</p>
    </div>
</div>

<div class="glass rounded-2xl max-w-2xl shadow-xl overflow-hidden relative">
    <div class="absolute top-0 w-full h-1 bg-gradient-to-r from-primary-400 to-primary-600"></div>
    
    <div class="p-8">
        <form method="POST" action="{{ url_for('gear_add') }}" class="space-y-6">
            
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                <!-- Name -->
                <div class="sm:col-span-2">
                    <label class="block text-sm font-medium text-gray-300">Item Name/Model</label>
                    <input type="text" name="name" required placeholder="e.g. Petzl GriGri 2" 
                        class="mt-1 block w-full px-4 py-3 bg-dark-900/50 border border-white/10 rounded-xl shadow-inner text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-primary-500 transition">
                </div>

                <!-- Category -->
                <div>
                    <label class="block text-sm font-medium text-gray-300">Category</label>
                    <select name="category_id" required 
                        class="mt-1 block w-full px-4 py-3 bg-dark-900 border border-white/10 rounded-xl shadow-inner text-white focus:outline-none focus:ring-2 focus:ring-primary-500 transition">
                        <option value="" disabled selected>Select a category</option>
                        {% for cat in categories %}
                        <option value="{{ cat.id }}">{{ cat.name }}</option>
                        {% endfor %}
                    </select>
                    <p class="text-xs text-gray-500 mt-1">Note: Creates are disabled in MVP UI. Add via DB directly if empty.</p>
                </div>

                <!-- Acq Method -->
                <div>
                    <label class="block text-sm font-medium text-gray-300">Acquisition Method</label>
                    <select name="acquisition_method" required 
                        class="mt-1 block w-full px-4 py-3 bg-dark-900 border border-white/10 rounded-xl shadow-inner text-white focus:outline-none focus:ring-2 focus:ring-primary-500 transition">
                        <option value="BOUGHT">Bought (Club Funds)</option>
                        <option value="DONATED">Donated by Alumni</option>
                    </select>
                </div>

                <!-- Purchase Price -->
                <div>
                    <label class="block text-sm font-medium text-gray-300">Purchase Price (₺) <span class="text-gray-500 text-xs">Optional</span></label>
                    <input type="number" step="0.01" name="purchase_price" placeholder="0.00" 
                        class="mt-1 block w-full px-4 py-3 bg-dark-900/50 border border-white/10 rounded-xl shadow-inner text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-primary-500 transition">
                </div>

                <!-- Mfg Date -->
                <div>
                    <label class="block text-sm font-medium text-gray-300">Manufacture Date <span class="text-rose-400">*Safety Critical</span></label>
                    <input type="date" name="manufacture_date" required 
                        class="mt-1 block w-full px-4 py-3 bg-dark-900/50 border border-white/10 rounded-xl shadow-inner text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-primary-500 transition">
                </div>
            </div>

            <div class="pt-6 border-t border-white/10 mt-6 flex justify-end">
                <button type="submit" 
                    class="px-6 py-3 bg-gradient-to-r from-primary-600 to-primary-500 hover:from-primary-500 text-white rounded-xl shadow-lg transition transform hover:-translate-y-0.5 font-bold">
                    Add Gear to Inventory
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
