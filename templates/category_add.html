{% extends "base.html" %}

{% block title %}Add Category | UDK Mezun{% endblock %}

{% block content %}
<div class="mb-8 flex items-center space-x-4">
    <a href="{{ url_for('category_list') }}" class="text-gray-400 hover:text-white bg-white/5 hover:bg-white/10 p-2 rounded-lg transition transform hover:-translate-x-1">&larr; Back</a>
    <div>
        <h1 class="text-3xl font-bold text-white">Add New Category</h1>
        <p class="text-gray-400 mt-1">Define a new equipment type.</p>
    </div>
</div>

<div class="glass rounded-2xl p-8 max-w-2xl mx-auto shadow-xl border-t border-primary-500/50">
    <form method="POST" class="space-y-6">
        <div class="space-y-2">
            <label class="block text-sm font-medium text-gray-300">Category Name</label>
            <input type="text" name="name" required placeholder="e.g. Ropes, Helmets, Carabiners"
                class="block w-full px-4 py-3 bg-dark-900 border border-white/10 rounded-xl shadow-inner text-white focus:outline-none focus:ring-2 focus:ring-primary-500 transition placeholder-gray-600">
        </div>
        
        <div class="space-y-2">
            <label class="block text-sm font-medium text-gray-300">Default Lifespan (Years)</label>
            <input type="number" name="default_lifespan_years" min="1" placeholder="Optional"
                class="block w-full px-4 py-3 bg-dark-900 border border-white/10 rounded-xl shadow-inner text-white focus:outline-none focus:ring-2 focus:ring-primary-500 transition placeholder-gray-600">
            <p class="text-xs text-gray-500">How many years does this gear typically last? Leave blank for no fixed expiration.</p>
        </div>

        <div class="pt-6 border-t border-white/10">
            <button type="submit" class="w-full py-4 bg-gradient-to-r from-primary-600 to-primary-500 hover:from-primary-500 text-white rounded-xl shadow-[0_0_20px_rgba(14,165,233,0.3)] transition transform hover:-translate-y-0.5 font-bold text-lg">
                Create Category
            </button>
        </div>
    </form>
</div>
{% endblock %}
